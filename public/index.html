  <!-- Sin esto, una ruta de dos niveles recargada a pelo (/clientes/<id>,
       /automatizaciones/<id>) pide "main.js" en RELATIVO: el navegador lo busca en
       /clientes/main.js, recibe un 404 y la app sale en blanco. Solo se nota al recargar o
       al pegar el enlace, por eso llevaba tiempo sin verse. La CSP de abajo permite base-uri
       'self' justo para que esto funcione. -->
  <base href="/">
  <!-- CSP (v6 feature 32). Va en un <meta> y no en una cabecera porque, según el
       despliegue, esta página puede servirla `ng serve` (dev), un host estático, o el
       propio backend (`CMRBACKEND`, un solo origen — ver su README). Consecuencia:
       `report-only` no está disponible (el navegador solo lo acepta por cabecera), así que
       la lista se validó recorriendo la app con la consola abierta.
       `script-src` NO lleva 'unsafe-inline': el único script en línea es el del tema, de
       ahí el hash. Si alguien lo edita, `npm run check` falla y dice qué hacer.
       Los estilos en línea sí se permiten: los inyecta Angular en cada componente.
       Las URL de la API salen de `src/environments/*.ts`, y aquí están **todas** las de
       todos los entornos que declaran un origen propio: un solo index.html para desarrollo
       y producción. `environment.prod.ts` trae `apiUrl: ''` (mismo origen que esta página,
       el caso de Heroku) y ESE no necesita entrada aquí: `self` ya lo cubre.
       ponytail: eso significa que la CSP de producción permite también localhost:3000,
       para cuando el `apiUrl` de producción SÍ es un dominio propio (API y app por
       separado). El techo es cosmético —la CSP acota a dónde puede conectarse esta página,
       y un origen que solo existe en la máquina del propio usuario no le abre nada a
       nadie— y a cambio no hay un segundo index.html que se olvide de actualizar. Camino,
       si algún día molesta: `"index"` por configuración en angular.json.
       `csp.check.ts` recorre `environments/` y falla si alguna URL con origen propio no
       está aquí.
       Sin `frame-ancestors`: el navegador lo ignora cuando la CSP llega por <meta>, y el
       widget embebible (feature 16) necesita permitir los dominios de sus clientes. Eso
       pide una cabecera de verdad y va con la feature del widget, no aquí. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'sha256-FpOzrm4sFSrPr58FMdzgf8Kr2ZYUWYjbhdJc7ti8cvk=';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob: http://localhost:3000;
    media-src 'self' data: blob: http://localhost:3000;
    connect-src 'self' http://localhost:3000 ws://localhost:3000 ws://localhost:4200;
    base-uri 'self';
    object-src 'none'">
