global:
  scrape_interval: 15s

scrape_configs:
  - job_name: whatsops-backend
    metrics_path: /metrics
    # El backend corre en el host (no en compose); host.docker.internal lo alcanza.
    static_configs:
      - targets: ['host.docker.internal:3000']
    # /metrics está protegido por METRICS_TOKEN (Bearer). Ajusta si lo cambias.
    authorization:
      type: Bearer
      credentials: dev-metrics-token
